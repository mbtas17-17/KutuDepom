name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Load existing signing key
        id: signing
        env:
          KEY_BASE64: ${{ secrets.KUTUDEPOM_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          encoded = os.environ.get('KEY_BASE64', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              if encoded:
                  path = Path(os.environ['RUNNER_TEMP']) / 'kutudepom-signing.jks'
                  path.write_bytes(base64.b64decode(encoded, validate=True))
                  path.chmod(0o600)
                  out.write(f'available=true\npath={path}\n')
              else:
                  out.write('available=false\n')
          PY
      - name: Build debug APK
        env:
          KUTUDEPOM_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KUTUDEPOM_STORE_PASSWORD: ${{ secrets.KUTUDEPOM_STORE_PASSWORD }}
          KUTUDEPOM_KEY_ALIAS: ${{ secrets.KUTUDEPOM_KEY_ALIAS }}
          KUTUDEPOM_KEY_PASSWORD: ${{ secrets.KUTUDEPOM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify update signing certificate
        env:
          EXISTING_KEY: ${{ steps.signing.outputs.available }}
          EXPECTED_CERT: ${{ vars.KUTUDEPOM_EXPECTED_SIGNER_SHA256 }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > signing-certificate.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          expected = os.environ.get('EXPECTED_CERT') or '6209861ecfc4bdcf08a14d516c2307cc4782f4a2121831b2cc266de348e46684'
          text = Path('signing-certificate.txt').read_text()
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', text).group(1).lower()
          available = os.environ['EXISTING_KEY'] == 'true'
          if available and actual != expected.replace(':','').lower():
              raise SystemExit('Signing key does not match the installed APK. No update artifact published.')
          Path('signing-status.txt').write_text('UPDATE_SIGNER_MATCHED\n' if available else 'TEST_ONLY: original signing key is missing; not an in-place update of 0.4.0.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.available == 'true' && 'KutuDepom-APK' || 'KutuDepom-TEST-APK' }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-status.txt
            signing-certificate.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: app/build/reports/
  database-tests:
    name: Android tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            size: 720x1280
            density: 360
          - api: 35
            size: 1440x3120
            density: 560
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Download/kutudepom-previews ui-previews
      - name: Show Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.attrib)
                      print(failure.text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-reports-API-${{ matrix.api }}
          path: app/build/reports/androidTests/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews-API-${{ matrix.api }}
          path: ui-previews/
